# 9000 frames is about 5 minutes at 30 updates/second.
# Set to 0 to leave the standard game timeout untouched. Valid range: 0..65535.
amiibo_timeout_frames = 9000

# Normal startup output. Warnings and errors are always logged.
log_versions = true
log_settings = true
# Detailed installation and gameplay diagnostics (quiet by default).
log_debug = false
