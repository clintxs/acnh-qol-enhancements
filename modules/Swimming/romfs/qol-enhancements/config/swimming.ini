enabled = true
version = 0.4.22

# Analog swimming at the surface and underwater, with one opening arm stroke.
# Strokes add up to 62.5% of full cruise speed. A repeats on a 2s cooldown.
# Boost starts 0.5s into the stroke and fades for 1.5s.
# Set auto_swim=false for vanilla movement; disable the module for all vanilla behavior.
auto_swim = true

# Allow the normal three right-stick camera tilt positions while swimming forward.
camera_tilt_while_swimming = true
