# Personal overrides. Omitted keys inherit faster-dialogue.ini values.
# enabled/version are optional here; normally keep them in the regular file.
# Both speeds accept whole numbers 1..10; defaults remain 2x/4x.
# Scaling preserves the live language/FPS-adjusted rate, so tiers are nominal.
base_speed = 2
boost_speed = 4
faster_ui = true
# Unnamed gameplay bubbles; faster_player is a compatibility alias.
faster_unnamed = true
faster_npc_list = Timmy, Tommy, Orville, Wilbur, Kapp'n
# Internal resource IDs work too: rcm, rct, dod, doc, kpp
# The friendly Kapp'n alias includes its known alternate kppB profile.
# Localized names also work: add Blathers in English, or owl in any language.
# Save as UTF-8 for names such as Sócrates or フータ.
